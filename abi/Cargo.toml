[package]
name = "pushmount-abi"
description = "Stable C ABI over pushmount-core. The single surface every language binding targets."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pushmount"
# cdylib for dynamic FFI (Python ctypes, Ruby FFI, Node); staticlib for cgo and for
# anyone who would rather link it in.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pushmount-core = { path = "../core" }
